name: Update events snapshot

# connpass API からイベントを取得し、data/events.json を更新して main に push する。
# サイトからは connpass API を呼ばない。API を呼ぶのはスナップショットの更新時だけ
# （このワークフローの定期実行・手動実行と、手元の pnpm fetch:events / fetch:events:local）。
on:
  schedule:
    # 1 日 1 回（UTC 18:00 = 日本時間 3:00）
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Fetch connpass events
    runs-on: ubuntu-latest
    # API キーは Environment「workflow」の secret CONNPASS_API_KEY に置く。
    # main への push には同じ Environment の secret PAGES_DEPLOY_PAT（repo / workflow スコープの PAT）を使う。
    # GITHUB_TOKEN による push では Cloudflare Pages（Workers Builds）のデプロイが走らないため。
    environment: workflow
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check deploy token
        env:
          PAGES_DEPLOY_PAT: ${{ secrets.PAGES_DEPLOY_PAT }}
        run: |
          if [ -z "$PAGES_DEPLOY_PAT" ]; then
            echo "::error::Environment「workflow」に secret PAGES_DEPLOY_PAT がありません。GITHUB_TOKEN で push すると Cloudflare Pages がデプロイしないため、PAT を登録してください。"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          # PAT で checkout し、後の git push もこの PAT（持ち主のユーザー）として行う
          token: ${{ secrets.PAGES_DEPLOY_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch events from connpass API
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: pnpm fetch:events

      - name: Commit and push snapshot
        env:
          LEFTHOOK: "0"
        run: |
          git add data/events.json
          if git diff --cached --quiet; then
            echo "data/events.json に変更はありません"
            exit 0
          fi
          git config user.name "Yuto Ichinose"
          git config user.email "60034520+illionillion@users.noreply.github.com"
          git commit -m "chore: connpass のイベントスナップショットを更新する"
          git push origin HEAD:main
