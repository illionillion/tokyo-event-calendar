name: Update events snapshot

# connpass API からイベントを取得し、data/events.json を更新して main に push する。
# 都道府県の検索に加え、data/connpass-supplements.json の subdomain と event_id も同じ実行で足す。
# サイトからは connpass API を呼ばない。API を呼ぶのはスナップショットの更新時だけ
# （このワークフローの定期実行・手動実行と、手元の pnpm fetch:events / fetch:events:local）。
#
# フリープランは 12 秒につき 1 リクエスト、1 日 100 リクエストまで（2026-11-04 から）。
# この cron は 1 日 1 回。workflow_dispatch を同じ日に 1 回まで見込むと、1 バッチあたり 50 回まで。
# 2026-11-11 の取得結果は重複除去後 541 件。見込みは 1 バッチ約 7 回（都道府県 6 + subdomain 1 + event_id 0）。
# 根拠と上限でのスキップは lib/connpass-rate-limit.ts。間隔は 12.5 秒。
# 終了から 7 日を超えたイベントはスナップショットに書かない。
on:
  schedule:
    # 1 日 1 回（UTC 18:00 = 日本時間 3:00）
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Fetch connpass events
    runs-on: ubuntu-latest
    # API キーは Environment「workflow」の secret CONNPASS_API_KEY に置く
    environment: workflow
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch events from connpass API
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: pnpm fetch:events

      - name: Commit and push snapshot
        env:
          LEFTHOOK: "0"
        run: |
          git add data/events.json
          if git diff --cached --quiet; then
            echo "data/events.json に変更はありません"
            exit 0
          fi
          git config user.name "Yuto Ichinose"
          git config user.email "60034520+illionillion@users.noreply.github.com"
          git commit -m "chore: connpass のイベントスナップショットを更新する"
          # push は GITHUB_TOKEN で行う（この push では Cloudflare Pages のデプロイが走らないことがある）
          git push origin HEAD:main
