name: 機能実装
description: 新機能の開発やエンハンスメント
title: "[Feature] "
labels: ["feature", "enhancement"]
body:
  - type: textarea
    id: overview
    attributes:
      label: 機能概要
      description: 実装したい機能の概要を記載してください。
      placeholder: 例：キーワードでイベントを絞り込めるフィルタを追加したい
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 対象範囲
      description: 主にどの部分の機能実装ですか？
      options:
        - UI（カレンダー・レイアウト）
        - 日付ナビゲーション
        - イベント一覧・カード
        - フィルタ（場所・キーワード）
        - connpass データ取得
        - 共通（型定義・ユーティリティ）
        - その他
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外範囲
      description: 今回の機能実装では対象外とする範囲を明記してください。
      placeholder: |
        例：
        - 東京以外の地域は対象外
        - ユーザーアカウント機能は対象外
        - connpass 以外のイベントソースは対象外
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: なぜこの機能が必要なのか、ユーザーにどんな価値を提供するかを記載してください。
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 受け入れ条件
      description: この機能が完成したとみなす条件を箇条書きで記載してください。
      placeholder: |
        - [ ] キーワード入力でイベントを絞り込める
        - [ ] 該当件数がない場合に空状態が表示される
        - [ ] 日付変更後もフィルタ条件が維持される
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: 技術的な考慮事項
      description: 実装時に考慮すべき技術的な要素があれば記載してください。
      placeholder: 例：connpass API のレート制限、日付のタイムゾーン、クライアント側キャッシュなど
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他・備考
      description: 補足情報や参考資料があれば記載してください。
    validations:
      required: false
